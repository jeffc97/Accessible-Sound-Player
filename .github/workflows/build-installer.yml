name: Build Accessible Sound Effects Player Installer

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Extract source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:GITHUB_WORKSPACE 'AccessibleSoundEffectsPlayer-Source.zip'
          $destination = Join-Path $env:GITHUB_WORKSPACE 'source'

          if (-not (Test-Path -LiteralPath $archive)) {
            throw "Source archive was not found: $archive"
          }

          Expand-Archive -LiteralPath $archive -DestinationPath $destination -Force
          $project = Join-Path $destination 'AccessibleSoundPlayer'

          if (-not (Test-Path -LiteralPath (Join-Path $project 'AccessibleSoundPlayer.csproj'))) {
            throw 'The project file was not found after extracting the source archive.'
          }

          "PROJECT_ROOT=$project" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Publish application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          dotnet publish "$env:PROJECT_ROOT\AccessibleSoundPlayer.csproj" `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -o "$env:PROJECT_ROOT\publish"

          if ($LASTEXITCODE -ne 0) {
            throw "Application compilation failed with exit code $LASTEXITCODE."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          choco install innosetup --no-progress --yes

          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup installation failed with exit code $LASTEXITCODE."
          }

      - name: Build Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          $programFilesX86 = [Environment]::GetFolderPath('ProgramFilesX86')
          $candidates = @(
            (Join-Path $programFilesX86 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:ProgramFiles 'Inno Setup 6\ISCC.exe'),
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe')
          )

          $iscc = $candidates |
            Where-Object { $_ -and (Test-Path -LiteralPath $_) } |
            Select-Object -First 1

          if (-not $iscc) {
            $iscc = Get-ChildItem `
              -Path 'C:\Program Files*','C:\ProgramData\chocolatey' `
              -Filter ISCC.exe `
              -File `
              -Recurse `
              -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
          }

          if (-not $iscc) {
            throw 'Inno Setup was installed, but ISCC.exe could not be found.'
          }

          Write-Host "Using Inno Setup compiler: $iscc"
          & $iscc "$env:PROJECT_ROOT\installer.iss"

          if ($LASTEXITCODE -ne 0) {
            throw "Installer creation failed with exit code $LASTEXITCODE."
          }

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: AccessibleSoundEffectsPlayer-Setup
          path: source/AccessibleSoundPlayer/installer-output/AccessibleSoundEffectsPlayer-Setup.exe
          if-no-files-found: error
          retention-days: 30
